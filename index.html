<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI ফ্রিল্যান্সিং কোর্স</title>
<meta name="description" content="ChatGPT, Claude ও Canva দিয়ে ঘরে বসে ইনকামের কাজ শিখুন। ১৫টি ভিডিও, বোনাস প্রম্পট ও টেমপ্লেট।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E1B2C; --ink:#1B2735; --muted:#4A5868; --line:#DDE3EA;
  --bg:#F7F9FB; --card:#FFFFFF; --green:#0A7F55; --tint:#E6F4EE; --amber:#FFC13B;
  --bkash:#D6125E; --nagad:#E8590C; --rocket:#7B2D8E; --wa:#1FA855;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:84px}
a{text-decoration:none;color:inherit}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* offer bar (first screen only, not sticky) */
.offer{background:var(--amber);color:var(--navy)}
.offer .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 20px;padding-top:10px;padding-bottom:10px}
.offer-text{font-size:17px;font-weight:600;text-align:center}
.offer-text s{font-weight:500;opacity:.75}
.timer{display:flex;align-items:center;gap:8px}
.timer-box{background:var(--navy);color:#fff;border-radius:8px;padding:2px 10px;text-align:center;min-width:64px;line-height:1.25}
.timer-box b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.timer-box span{display:block;font-size:12px;color:#C9D3DF}
.timer-sep{font-size:22px;font-weight:700}

/* hero */
.hero{background:var(--navy);color:#fff}
.hero .wrap{padding-top:40px;padding-bottom:72px;display:flex;flex-direction:column;gap:44px}
.topline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 12px}
